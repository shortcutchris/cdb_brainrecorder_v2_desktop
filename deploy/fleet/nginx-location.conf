# Insert into the existing HTTPS server block for cdblab.de only.
# Run nginx -t before reload; retain all other routes and TLS settings.
location = /devices { return 308 /devices/; }
location ^~ /devices/ {
    resolver 127.0.0.11 valid=30s;
    set $fleet_upstream cdb-fleet:8460;
    rewrite ^/devices/(.*)$ /$1 break;
    proxy_pass http://$fleet_upstream;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    client_max_body_size 16k;
}
