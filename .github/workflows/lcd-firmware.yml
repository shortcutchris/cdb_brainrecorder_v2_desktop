name: LCD USB firmware
on:
  push:
    branches: [codex/lcd-usb-timer-display]
    paths: ['firmware/lcd-usb/**', 'scripts/lcd-display/**', '.github/workflows/lcd-firmware.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Waveshare BSP
        run: python3 scripts/lcd-display/prepare_vendor.py
      - name: Compile ESP32-S3 firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware/lcd-usb
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: lcd-usb-compile-candidate
          path: |
            firmware/lcd-usb/build/cdb_lcd_usb.bin
            firmware/lcd-usb/build/bootloader/bootloader.bin
            firmware/lcd-usb/build/partition_table/partition-table.bin
            firmware/lcd-usb/build/flasher_args.json
            firmware/lcd-usb/dependencies.lock
