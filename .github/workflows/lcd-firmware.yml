name: LCD USB firmware
on:
  push:
    branches: [main, codex/recording-source-fix]
    paths: ['firmware/lcd-usb/**', 'scripts/lcd-display/**', '.github/workflows/lcd-firmware.yml']
  pull_request:
    paths: ['firmware/lcd-usb/**', 'services/lcd_*.py', 'scripts/lcd-display/**', '.github/workflows/lcd-firmware.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lcd-firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Waveshare BSP
        run: python3 scripts/lcd-display/prepare_vendor.py
      - name: Native protocol checks
        run: |
          cc -std=c11 -fsanitize=address,undefined -c /opt/esp/idf/components/json/cJSON/cJSON.c -o /tmp/lcd-cjson.o
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I /opt/esp/idf/components/json/cJSON firmware/lcd-usb/test_protocol.c firmware/lcd-usb/main/protocol.c /tmp/lcd-cjson.o -lm -o /tmp/lcd-protocol-test
          /tmp/lcd-protocol-test
      - name: Companion integration over simulated USB
        run: |
          python3 -m venv /tmp/lcd-test-env
          /tmp/lcd-test-env/bin/pip install pyserial==3.5
          /tmp/lcd-test-env/bin/python scripts/lcd-display/test_serial.py
      - name: Compile ESP32-S3 firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware/lcd-usb
          idf.py -DIDF_TARGET=esp32s3 build
      - uses: actions/upload-artifact@v4
        with:
          name: lcd-usb-compile-candidate
          path: |
            firmware/lcd-usb/build/cdb_lcd_usb.bin
            firmware/lcd-usb/build/bootloader/bootloader.bin
            firmware/lcd-usb/build/partition_table/partition-table.bin
            firmware/lcd-usb/build/flasher_args.json
            firmware/lcd-usb/dependencies.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcd-usb-build-diagnostics
          path: |
            firmware/lcd-usb/build/log/
            firmware/lcd-usb/sdkconfig
            firmware/lcd-usb/dependencies.lock
